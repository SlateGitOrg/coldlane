[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coldlane"
version = "0.1.0"
description = "Cold-chain logger analysis: mean kinetic temperature, leg-attributed excursion minutes, and gaps treated as unknown."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "coldlane contributors" }]
keywords = ["cold-chain", "tableau", "duckdb", "pharma-logistics", "temperature-monitoring"]
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyyaml>=6",
]

[project.scripts]
coldlane = "coldlane.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/coldlane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
